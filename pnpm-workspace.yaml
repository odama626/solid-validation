packages:
  - docs
  - docs/demos

allowBuilds:
  esbuild: true
  sharp: true
  '@parcel/watcher': true

# The docs shell runs Solid 2; docs/demos runs Solid 1 so it can host the
# current v1 library in an iframe. Only the shell's tree is pinned.
overrides:
  '@kobalte/core>solid-js': 2.0.0-rc.8
  '@kobalte/core>@solidjs/web': 2.0.0-rc.8
  '@kobalte/utils>solid-js': 2.0.0-rc.8
  '@kobalte/utils>@solidjs/web': 2.0.0-rc.8
